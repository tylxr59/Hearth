[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "hearth-local"
version = "0.1.0"
description = "Experimental local Nest transport and provisioning laboratory"
requires-python = ">=3.12"
dependencies = ["aiohttp==3.14.5", "paho-mqtt==2.1.0"]

[tool.setuptools.packages.find]
include = ["backend*", "firmware*", "provisioning*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
