[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "hearth-local"
version = "0.9.1"
description = "Local Nest thermostat integration and guided USB installer"
requires-python = ">=3.12"
dependencies = ["aiohttp==3.14.5", "paho-mqtt==2.1.0"]

[project.scripts]
hearth = "installer.cli:main"

[tool.setuptools.packages.find]
include = ["backend*", "firmware*", "provisioning*", "installer*", "tools*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["custom_components/hearth/_backend"]
line-length = 100
