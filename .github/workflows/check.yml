name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  laboratory:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install hash-locked development environment
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --require-hashes -r requirements-dev.lock
      - run: make check
      - run: make test
      - run: .venv/bin/python -m tools.check_native_ha build/ha-ci --engine docker
      - run: make audit
      - run: make release

  hassfest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361
  hacs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration
          comment: "false"
